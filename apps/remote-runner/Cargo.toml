[package]
name = "lilac-remote-runner"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native runner that Lilac Core uploads to SSH hosts for remote commands and file operations."
license = "MIT"

[[bin]]
name = "lilac-remote"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
globset = "0.4.21"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", features = ["process", "signal"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
