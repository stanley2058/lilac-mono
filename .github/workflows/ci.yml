name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Source checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      LILAC_BLOB_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      LILAC_BLOB_S3_TEST_BUCKET: lilac-blob-test
      LILAC_BLOB_S3_TEST_ACCESS_KEY_ID: lilac-ci-access
      LILAC_BLOB_S3_TEST_SECRET_ACCESS_KEY: lilac-ci-secret-key
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Production uses rustfs. Service env cannot read job env, so the credentials repeat.
      rustfs:
        image: rustfs/rustfs:1.0.4
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: lilac-ci-access
          RUSTFS_SECRET_KEY: lilac-ci-secret-key
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Go for tools CLI boundary tests
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      # GitHub has no Debian runners. Match the GNU coreutils in the Debian images.
      - name: Use GNU coreutils
        run: |
          sudo apt-get install -y --allow-remove-essential coreutils-from-gnu coreutils-from-uutils-
          cat --version | grep -F 'GNU coreutils'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create the S3 test bucket
        run: >-
          curl --fail-with-body --silent --show-error
          --aws-sigv4 "aws:amz:us-east-1:s3"
          --user "$LILAC_BLOB_S3_TEST_ACCESS_KEY_ID:$LILAC_BLOB_S3_TEST_SECRET_ACCESS_KEY"
          -X PUT "$LILAC_BLOB_S3_TEST_ENDPOINT/$LILAC_BLOB_S3_TEST_BUCKET"

      - name: Run CI script
        run: bun run ci

      - name: Install the packed remote fs runner
        run: bun run test:remote-fs-package

      - name: Test process and Redis resilience
        run: bun run test:resilience

      - name: Run end-to-end agent scenarios
        run: bun run test:e2e

  docker-image:
    name: Docker image smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lilac:ci
          cache-from: type=gha,scope=ci-lilac-mono-amd64
          cache-to: type=gha,mode=max,scope=ci-lilac-mono-amd64

      - name: Verify image
        run: bash docker/verify-image.sh lilac:ci

  computer-use:
    name: Computer-use Docker integration
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build runner and gateway images
        run: bun run docker:build:computer-use
      - name: Test Docker lifecycle
        run: bun run test:computer-use:docker
