
[program:lilac-executor]
command=/opt/venv/bin/python -B /opt/lilac-computer/runtime.py serve
user=cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus"
autorestart=false
startsecs=0
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
priority=30
