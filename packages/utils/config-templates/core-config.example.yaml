# yaml-language-server: $schema=./.schemas/core-config.schema.json
# Hover for documentation; use completion to discover optional settings.
configVersion: 3
basePrompt: You are Lilac.
surface:
  discord:
    tokenEnv: DISCORD_TOKEN
    allowedChannelIds: []
    allowedGuildIds: []
    botName: lilac
models:
  main:
    model: openrouter/openai/gpt-4o
  fast:
    model: openrouter/openai/gpt-4o-mini
conversation:
  thread:
    autoInject:
      plannerModel: fast
